  <body>
    <script>
      // Theme initialization: apply saved theme (light/dark/system) before React mounts
      (function () {
        try {
          var key = "theme-preference";
          var pref = null;
          try {
            pref = localStorage.getItem(key);
          } catch (e) {
            /* ignore */
          }

          function apply(isDark) {
            try {
              if (isDark) document.documentElement.classList.add("dark");
              else document.documentElement.classList.remove("dark");
            } catch (e) {}
          }

          if (pref === "light") {
            apply(false);
          } else if (pref === "dark") {
            apply(true);
          } else {
            // system or null
            var mq =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)");
            apply(mq ? mq.matches : false);
          }
        } catch (e) {
          // noop
        }
      })();

      // Admin theme initialization: apply saved admin theme before React mounts
      (function () {
        try {
          var adminKey = "admin:theme-preference";
          var adminPref = null;
          try {
            adminPref = localStorage.getItem(adminKey);
          } catch (e) {
            /* ignore */
          }

          function getSystemPrefersDark() {
            return (
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
            );
          }

          function applyAdmin(isDark) {
            try {
              var root = document.getElementById("admin-root");
              if (!root) return; // admin-root doesn't exist yet, will be handled by useAdminTheme hook
              if (isDark) root.classList.add("dark");
              else root.classList.remove("dark");
            } catch (e) {}
          }

          if (adminPref === "light") {
            applyAdmin(false);
          } else if (adminPref === "dark") {
            applyAdmin(true);
          } else if (adminPref === "system") {
            applyAdmin(getSystemPrefersDark());
          }
          // If adminPref is null, useAdminTheme hook will handle initialization
        } catch (e) {
          // noop
        }
      })();
    </script>
    <div id="root"></div>
    <!-- Runtime error overlay: shows uncaught errors so a blank page can be diagnosed -->
    <div
      id="__error_overlay__"
      style="
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        z-index: 9999;
        padding: 24px;
        font-family:
          system-ui,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        overflow: auto;
      "
    ></div>
    <script>
      (function () {
        function showError(message) {
          try {
            var el = document.getElementById("__error_overlay__");
            if (!el) return;
            el.style.display = "block";
            // Sanitize error message: don't show stack traces or internal details to users
            var sanitized =
              "An error occurred. Please refresh the page or contact support if the problem persists.";
            el.innerText = sanitized;
            // Log to console for debugging in dev only
            console.error("Runtime error (logged to console only):", message);
          } catch (e) {
            console.error(e);
          }
        }

        window.addEventListener("error", function (ev) {
          var msg =
            ev && ev.error && ev.error.stack
              ? ev.error.stack
              : (ev && ev.message) || String(ev);
          showError("Error: " + msg);
        });

        window.addEventListener("unhandledrejection", function (ev) {
          var reason =
            ev && ev.reason
              ? ev.reason.stack || ev.reason
              : "Unhandled rejection";
          showError("Unhandled Rejection: " + reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
