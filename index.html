<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon1.png" />
    <title>World Facts - Know the World in One Glance</title>
    <meta
      name="description"
      content="Discover fascinating facts about countries worldwide, play interactive quizzes, and explore fun facts across multiple categories. Your gateway to world knowledge."
    />
    <meta name="author" content="World Facts" />

    <meta
      property="og:title"
      content="World Facts - Know the World in One Glance"
    />
    <meta
      property="og:description"
      content="Discover fascinating facts about countries worldwide, play interactive quizzes, and explore fun facts across multiple categories."
    />
    <meta property="og:type" content="website" />
    
  </head>

  <body>
    <div id="root"></div>
    <!-- Runtime error overlay: shows uncaught errors so a blank page can be diagnosed -->
    <div
      id="__error_overlay__"
      style="
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        z-index: 9999;
        padding: 24px;
        font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        overflow: auto;
      "
    ></div>
    <script>
      (function () {
        function showError(message) {
          try {
            var el = document.getElementById("__error_overlay__");
            if (!el) return;
            el.style.display = "block";
            el.innerText = message;
            console.error("Runtime error overlay:", message);
          } catch (e) {
            console.error(e);
          }
        }

        window.addEventListener("error", function (ev) {
          var msg =
            ev && ev.error && ev.error.stack
              ? ev.error.stack
              : (ev && ev.message) || String(ev);
          showError("Error: " + msg);
        });

        window.addEventListener("unhandledrejection", function (ev) {
          var reason =
            ev && ev.reason
              ? ev.reason.stack || ev.reason
              : "Unhandled rejection";
          showError("Unhandled Rejection: " + reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
